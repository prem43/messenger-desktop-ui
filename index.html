<body><div class="app"><nav class="rail" aria-label="Navigation"></nav><aside class="sidebar"><header class="list-header"><h1>WhatsApp</h1><div><button class="icon-btn" id="new-chat" title="New chat">▣</button><button class="icon-btn" id="list-menu" title="Settings">⋯</button></div></header><label class="search"><span>⌕</span><input id="search" placeholder="Search or start a new chat" aria-label="Search chats"></label><div class="filters" aria-label="Chat filters"><button data-filter="all" class="selected">All</button><button data-filter="unread">Unread</button><button data-filter="favorites">Favorites</button><button data-filter="groups">Groups</button></div><div class="archive-row"><span>▣</span><button id="archive-toggle">Archived</button><span id="archive-count"></span></div><div id="chat-list" class="chat-list"></div><div class="sidebar-footer">⌁ Your personal messages stay on this browser</div></aside><main class="conversation"><header class="conversation-header"><button id="back" class="icon-btn" aria-label="Back to chats">‹</button><button id="contact-button" class="contact-button"><span id="header-avatar" class="avatar"></span><span><strong id="header-name"></strong><small id="header-status"></small></span></button><div class="header-actions"><button class="icon-btn" id="video-call" title="Video call">▱</button><button class="icon-btn" id="audio-call" title="Audio call">♧</button><span class="divider"></span><button class="icon-btn" id="message-search-button" title="Search messages">⌕</button><button class="icon-btn" id="chat-menu" title="Chat options">⋮</button></div></header><div id="message-search-bar" class="message-search-bar" hidden><input id="message-search" placeholder="Search in conversation" aria-label="Search messages"><button class="icon-btn" id="close-search">×</button><span id="search-count"></span></div><section id="messages" class="messages" aria-label="Messages" aria-live="polite"></section><div id="attachment-preview" class="attachment-preview" hidden></div><div id="emoji-picker" class="emoji-picker" hidden></div><form id="composer" class="composer"><button type="button" class="icon-btn" id="emoji-button" title="Emoji">☺</button><button type="button" class="icon-btn" id="attach-button" title="Attach file">＋</button><input type="file" id="file-input" hidden><textarea id="draft" rows="1" placeholder="Type a message" aria-label="Type a message"></textarea><button type="submit" class="send" title="Send message" aria-label="Send message">➤</button></form><footer class="local-label">Local frontend · messages are not sent to WhatsApp</footer></main><aside id="details" class="details" hidden></aside></div><dialog id="modal"><div id="modal-content"></div><button id="modal-close" class="dialog-close" aria-label="Close dialog">×</button></dialog><div id="toast" role="status" hidden></div><script type="module" src="app.js"></script></body></html>
